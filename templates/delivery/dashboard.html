{% extends 'base.html' %}{% block content %}<section class="page-intro"><p class="eyebrow">فريق التوصيل</p><h1>طلباتك المكلّف بها</h1></section><section class="section compact">{% for order in orders %}<article class="order-row"><b>#{{ order.order_number }}</b><span>{{ order.customer_name }} — {{ order.phone }}</span><span>{{ order.total }} ل.س</span><a class="button primary" href="{% url 'delivery:map' order.order_number %}">عرض الموقع</a></article>{% empty %}<p>لا توجد طلبات مخصّصة لك الآن.</p>{% endfor %}</section>{% endblock %}
