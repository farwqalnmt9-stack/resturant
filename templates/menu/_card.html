<article class="product-card"><a href="{% url 'menu:detail' product.slug %}" class="product-image">{% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }}" loading="lazy">{% else %}<div class="image-placeholder"></div>{% endif %}</a><div class="product-body"><small>{{ product.category.name }}</small><h3><a href="{% url 'menu:detail' product.slug %}">{{ product.name }}</a></h3><p>{{ product.description|truncatewords:12 }}</p><div class="card-bottom"><b>{{ product.price }} ل.س</b><form action="{% url 'orders:add' product.id %}" method="post">{% csrf_token %}<button aria-label="أضف {{ product.name }} إلى السلة">أضف</button></form></div></div></article>
