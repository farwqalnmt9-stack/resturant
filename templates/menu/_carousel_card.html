{% load static %}<article class="menu-carousel-card menu-carousel-card--{{ layout }}{% if duplicate %} is-duplicate{% endif %}"{% if duplicate %} aria-hidden="true"{% endif %}><div class="menu-card-art">{% if product.image %}<img src="{{ product.image.url }}" alt="{% if duplicate %}{% else %}{{ product.name }}{% endif %}" loading="lazy">{% endif %}</div><div class="menu-card-copy"><small>{{ product.category.name }}</small><h2>{{ product.name }}</h2><p>{{ product.description|truncatewords:9 }}</p><div><b>{{ product.price }} ل.س</b>{% if duplicate %}<span class="menu-card-button">أضف</span>{% else %}<form action="{% url 'orders:add' product.id %}" method="post">{% csrf_token %}<button type="submit" aria-label="أضف {{ product.name }} إلى السلة">أضف</button></form>{% endif %}</div></div></article>
